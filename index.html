<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rohenäpp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-overlay"></div>

  <main class="app-shell">
    <section id="loginView" class="panel auth-panel active">
      <h1>🌿 Rohenäpp</h1>
      <p>Sinu nutikas roheline kaaslane igapäevasteks keskkonnasõbralikeks harjumusteks.</p>

      <form id="loginForm" class="login-form">
        <label>
          Kasutajanimi
          <input id="usernameInput" type="text" required placeholder="nt mari.roheline" />
        </label>
        <label>
          Parool
          <input type="password" required placeholder="••••••••" />
        </label>
        <button type="submit">Logi sisse</button>
      </form>
    </section>

    <section id="homeView" class="panel hidden">
      <header class="home-header">
        <div>
          <h2>Tere tagasi, <span id="welcomeName">Sõber</span> 👋</h2>
          <p>Täida rohelisi ülesandeid, vähenda jalajälge ja kogu punkte + raha.</p>
        </div>
        <button id="logoutBtn" class="ghost-btn">Logi välja</button>
      </header>

      <div class="stats-grid">
        <article class="stat-card">
          <h3>Punktid</h3>
          <p id="pointsValue">0</p>
        </article>
        <article class="stat-card">
          <h3>Raha (€)</h3>
          <p id="moneyValue">0.00</p>
        </article>
        <article class="stat-card">
          <h3>CO₂ vähenemine</h3>
          <p id="co2Value">0.0 kg</p>
        </article>
      </div>

      <section class="task-panel">
        <h3>🗓️ Tänased ülesanded</h3>
        <ul id="taskList"></ul>
      </section>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
